<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — WAQTORO</title>
  <meta name="description" content="The page you were looking for does not exist. Continue shopping at WAQTORO." />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="/favicon.png?v=2" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .notfound-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background: radial-gradient(80% 60% at 50% 20%, rgba(201,168,76,0.12), transparent), var(--clr-bg);
    }
    .notfound-card {
      width: 100%;
      max-width: 680px;
      background: var(--clr-bg-card);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .notfound-code {
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: 1;
      margin-bottom: 0.75rem;
      color: var(--clr-gold);
      font-family: var(--font-display);
    }
    .notfound-title {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-family: var(--font-display);
      margin-bottom: 0.75rem;
    }
    .notfound-text {
      color: var(--clr-white-dim);
      max-width: 520px;
      margin: 0 auto 1.75rem;
      font-size: 0.95rem;
    }
    .notfound-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .notfound-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--clr-white-dim);
    }
    .notfound-links a {
      color: var(--clr-gold-light);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="notfound-wrap">
    <section class="notfound-card">
      <p class="label-caps">WAQTORO Fine Timepieces</p>
      <p class="notfound-code">404</p>
      <h1 class="notfound-title">This page is unavailable</h1>
      <p class="notfound-text">The link may be outdated or mistyped. Continue from one of the main sections below.</p>

      <div class="notfound-actions">
        <a href="/index" class="btn btn-primary">Go to Home</a>
        <a href="/pages/shop" class="btn btn-outline">Shop Collection</a>
        <a href="/pages/contact" class="btn btn-ghost">Contact Support</a>
      </div>

      <div class="notfound-links">
        <a href="/pages/mens">Men</a>
        <a href="/pages/womens">Women</a>
        <a href="/pages/brands">Brands</a>
        <a href="/pages/cart">Cart</a>
      </div>
    </section>
  </main>
</body>
</html>
